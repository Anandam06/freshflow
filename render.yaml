services:
  - type: web
    name: freshflow-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: PYTHONPATH
        value: backend
      - key: FRESHFLOW_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: freshflow-db
          property: connectionString
      - key: FRESHFLOW_OPERATOR_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: freshflow-db
    plan: free
    databaseName: freshflow
    user: freshflow
    ipAllowList: []
