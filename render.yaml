# Render Blueprint: one free web service (API + frontend). Pushes to main redeploy automatically.
services:
  - type: web
    name: freshflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: FRESHFLOW_ENV
        value: public-demo        # anyone can run the free deterministic workflows without a key
      - key: FRESHFLOW_LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: FRESHFLOW_LLM_DAILY_BUDGET_USD
        value: "1.00"             # live Claude runs stop for the day after ~$1 (~500 decisions)
      - key: ANTHROPIC_API_KEY
        sync: false               # entered once in the Render dashboard; never in Git
