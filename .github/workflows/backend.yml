name: Backend validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freshflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: freshflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      TEST_DATABASE_URL: postgresql://freshflow:ci-only-password@localhost:5432/freshflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python backend/export_contract.py
      - run: git diff --exit-code shared/api-contract.yaml
