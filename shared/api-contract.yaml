components:
  schemas:
    ApprovalRequest:
      properties:
        approve:
          type: boolean
          title: Approve
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
      - approve
      - expected_version
      title: ApprovalRequest
    BatchPage:
      properties:
        run_id:
          type: string
          title: Run Id
        repetition:
          type: integer
          title: Repetition
        offset:
          type: integer
          title: Offset
        limit:
          type: integer
          title: Limit
        total:
          type: integer
          title: Total
        batches:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Batches
      additionalProperties: false
      type: object
      required:
      - run_id
      - repetition
      - offset
      - limit
      - total
      - batches
      title: BatchPage
    BatchState:
      properties:
        id:
          type: string
          title: Id
        version:
          type: integer
          title: Version
        status:
          type: string
          title: Status
        evidence_category:
          type: string
          const: SYNTHETIC
          title: Evidence Category
          default: SYNTHETIC
        quantity_kg:
          type: number
          title: Quantity Kg
        initial_rsl_hours:
          type: number
          title: Initial Rsl Hours
        rsl_hours:
          type: number
          title: Rsl Hours
        rsl_lower_hours:
          type: number
          title: Rsl Lower Hours
        destination:
          type: string
          title: Destination
        delay_hours:
          type: number
          title: Delay Hours
        safety_hold:
          type: boolean
          title: Safety Hold
        event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Event
        proposal:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Proposal
        agent_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Mode
        monitoring:
          type: boolean
          title: Monitoring
        trace:
          items:
            $ref: '#/components/schemas/TraceEntry'
          type: array
          title: Trace
        current_location:
          type: string
          title: Current Location
          default: junction
        elapsed_hours:
          type: number
          title: Elapsed Hours
          default: 6
        buyer_capacities:
          additionalProperties:
            type: number
          type: object
          title: Buyer Capacities
        unavailable_buyers:
          items:
            type: string
          type: array
          title: Unavailable Buyers
        price_factors:
          additionalProperties:
            type: number
          type: object
          title: Price Factors
        quality_grade:
          type: string
          title: Quality Grade
          default: A
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - status
      - quantity_kg
      - initial_rsl_hours
      - rsl_hours
      - rsl_lower_hours
      - destination
      - delay_hours
      - safety_hold
      - event
      - proposal
      - agent_mode
      - monitoring
      - trace
      title: BatchState
    ComparisonExport:
      properties:
        shipment_ids:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 1
          title: Shipment Ids
      additionalProperties: false
      type: object
      required:
      - shipment_ids
      title: ComparisonExport
    CreatedSimulation:
      properties:
        id:
          type: string
          title: Id
        result:
          $ref: '#/components/schemas/SimulationResult'
      additionalProperties: false
      type: object
      required:
      - id
      - result
      title: CreatedSimulation
    Disruption:
      properties:
        type:
          type: string
          enum:
          - heavy_traffic
          - road_closure
          - temperature_rise
          - refrigeration_failure
          - humidity_problem
          - buyer_cancellation
          - price_drop
          - product_damage
          title: Type
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          title: Severity
          default: medium
      additionalProperties: false
      type: object
      required:
      - type
      title: Disruption
    EventRequest:
      properties:
        temperature_c:
          type: number
          maximum: 50.0
          minimum: 5.0
          title: Temperature C
          default: 35
        duration_hours:
          type: number
          maximum: 72.0
          exclusiveMinimum: 0.0
          title: Duration Hours
          default: 6
        delay_hours:
          type: number
          maximum: 72.0
          minimum: 0.0
          title: Delay Hours
          default: 12
        safety_hold:
          type: boolean
          title: Safety Hold
          default: false
      additionalProperties: false
      type: object
      title: EventRequest
    EvidenceRegister:
      properties:
        assumptions:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Assumptions
        sources:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Sources
      additionalProperties: false
      type: object
      required:
      - assumptions
      - sources
      title: EvidenceRegister
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        version:
          type: string
          title: Version
