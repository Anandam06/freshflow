        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: rescue_only
        in: query
        required: false
        schema:
          type: boolean
          description: Only batches where the simulated M3 policy attempted a rescue
          default: false
          title: Rescue Only
        description: Only batches where the simulated M3 policy attempted a rescue
      responses:
        '200':
          description: Successful Response
          content:
